# Fiche d'état du projet — autorité de l'état depuis ADR-0020 (design §6.2).
# La section statut du README est générée depuis cette fiche (sentinelles).
schema_version: libre-ai.project.v1
project: project-governance
repository: libre-ai/project-governance
kind: authority
layer: transverse
statement:
  for: "les projets de la constellation Libre AI"
  who_faces: "le coût et la dérive de machineries recopiées d'un repo à l'autre"
  enables: "s'appuyer sur une doctrine et des gates uniques au lieu de règles recopiées"
  producing:
    - "un gabarit de flotte consommé par SHA et des gates qui surveillent toute la constellation"
  without_depending_on:
    - "aucun service tiers, aucune copie non vérifiée — consommation épinglée et gates de dérive"
summary: "Autorité de doctrine : décisions, invariants, index d'écosystème, schéma de fiches, outillage de flotte."
current_situation: >-
  Autorité de doctrine et d'outillage de flotte depuis le transfert tracé du
  2026-10-07, qui exécute la direction propriétaire du 2026-09-29 : doctrine
  (ADR 0001 à 0043, LEXICON, registres d'invariants et de décisions), gates
  d'écosystème, workflows réutilisables et gate de composition multi-dépôts.
  Mesures du 2026-10-08 : le gate de dérive d'inventaire est vert (24 dépôts
  déclarés, 24 observés, 0 dérive) ; le gate d'épinglage lit 60 pins sur 20 des
  22 cibles, 0 illisible, contre 10 générations déclarées ; la présentation de
  flotte tient sur 24 dépôts. Restent rouges la conformité de contexte (1 sur 24 :
  application-development-toolkit, sans AGENTS.md sur sa branche servie) et
  celle de Dependabot (2 sur 24 : application-development-toolkit sans copie,
  `.github` sans variante publiée pour son jeu de manifestes). Le corpus
  historique de `governance` (docs/reviews, la majorité de docs/superpowers)
  reste dans l'archive vérifiée, non déclaré supersédé.
scope:
  - "Autorité de doctrine : décisions, invariants, index d'écosystème, schéma de fiches, outillage de flotte."
  - "Autorité de marque : plateforme verbale, exigences de preuve et projection publique générée."
non_goals:
  - "aucune seconde implémentation durable de ce domaine ailleurs dans la constellation"
dependencies:
