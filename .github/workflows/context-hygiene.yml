name: Context hygiene

# Blocks private identifiers and machine-local paths from entering the public
# tree. The checks, their encoded deny patterns and their exemptions live in
# tools/quality/check-context-hygiene.sh, which `bun run check` also runs
# (2026-10-14): inline here they were invisible to a local check.
on:
  push:
    # The served branch is listed: with `[main]` alone this workflow had
    # ZERO push runs on `migrate/recover-code` — every one of its runs was a
    # pull_request, so no verdict was ever attached to a merged head.
    branches: [main, migrate/recover-code]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-hygiene:
    name: No private identifiers or machine-local paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Banned identifiers, machine-local paths, symlink targets (hard fail)
        run: bash tools/quality/check-context-hygiene.sh
