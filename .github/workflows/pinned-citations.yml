name: pinned-citations

# Pinned-citations gate (tools/quality/check-pinned-citations.ts): every pinned
# code citation of docs/ (`libre-ai/<repository>@<sha>:<path>[:<lines>]`) names a
# repository, a commit, a path and lines that exist, and an ADR above the
# threshold of tools/quality/pinned-citations.v1.json cites no bare path:line it
# cannot resolve here and no local pin (`<sha>:<path>`) this repository does not
# carry. Asked over the git protocol (ls-remote, blobless bare clone), never the
# REST API: no token, no quota.
#
# A workflow of its own, and a required check of the served branch (owner
# arbitration 2026-10-23): it used to be a step of inventory-drift.yml, whose
# fleet gates are knowingly red, so the job could not be required without
# blocking every pull request on gates no governance pull request can turn
# green. It reads other repositories, hence not in `bun run check`. The day a
# cited repository is deleted, every pull request turns red here until its
# citations are exempted with a reason: that is the signal this check exists
# to give before an irreversible act is declared safe.
#
# The gate offers no credential to the repositories it asks, and the checkout
# keeps none either: the only git configuration it reads from this clone is the
# `origin` URL, from which it derives the name of this repository.

on:
  push:
    # The served branch is listed, like inventory-drift.yml: with `[main]` alone
    # no verdict would be attached to a merged head of `migrate/recover-code`.
    branches: [main, migrate/recover-code]
  pull_request:
  # A cited repository can be deleted while no pull request is open: the weekly
  # run sees it anyway, at the slot the gate had in inventory-drift.yml. The
  # manual run is the second look to take before declaring a deletion safe.
  schedule:
    - cron: "43 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # The repeat-failure alert files and closes governance issues on the
  # scheduled and dispatched runs only (see the event guard on its steps). The
  # gate step itself is handed no token.
  issues: write

concurrency:
  group: pinned-citations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-citations:
    name: Every pinned code citation of the documents resolves
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install archived Bun toolchain
        env:
          BUN_ARCHIVE_URL: https://github.com/libre-ai/project-governance/releases/download/toolchain-bun-1.4.0-canary.1-57f349f63/bun-linux-x64.zip
          BUN_ARCHIVE_SHA256: 83144e2542c33aaae541cf16b42f8cf1c55c3b94c5395fc776417fa27e95bcbf
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bun.zip" "$BUN_ARCHIVE_URL"
          echo "$BUN_ARCHIVE_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Verify the exact Bun revision
        run: test "$(bun --revision)" = "1.4.0-canary.1+57f349f63"
      - run: bun run check:pinned-citations
      # A red scheduled run is only visible to someone who opens the Actions
      # tab. One red run stays a run; two in a row file a deduplicated
      # governance issue, and the next green run closes it. The push and
      # pull_request runs belong to the CI gate and are excluded by the guard.
      - name: File an issue if this is the second consecutive failed run
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: pinned-citations
          WORKFLOW_FILE: pinned-citations.yml
          CURRENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun tools/security/repeat-failure-alert.ts
      - name: Close the repeat-failure issue now that the loop is green
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: pinned-citations
          WORKFLOW_FILE: pinned-citations.yml
          CURRENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun tools/security/repeat-failure-alert.ts --resolve
