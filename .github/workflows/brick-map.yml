name: Brick map

# The brick map (ADR-0064) is data: eleven layer files and one fiche per brick
# under ecosystem/briques/. This workflow runs its gate on the tree a pull
# request delivers and on every merged head, so the counters it prints (bricks
# per layer, derived status, proofs held) are attached to a commit.
#
# It is a workflow of its own, not a link of `bun run check`: ADR-0064 leaves
# to the owner the act of making this gate a required context, after the first
# data exists. Chained into the aggregate, it would have become required
# through `Bun quality` without that act.
on:
  push:
    # The served branch is listed, as in feeds-freshness.yml: with `[main]`
    # alone no verdict would ever be attached to a merged head.
    branches: [main, migrate/recover-code]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brick-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brick-map:
    name: Brick map layers, bricks and derived status
    runs-on: ubuntu-latest
    # The gate reads the index and a few doctrine files: seconds. A run that
    # lasts is a defect, and it fails closed here rather than at the runner's limit.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `bun install` runs after this step: the token is not left in the clone.
          persist-credentials: false
      - name: Install archived Bun toolchain
        env:
          BUN_ARCHIVE_URL: https://github.com/libre-ai/project-governance/releases/download/toolchain-bun-1.4.0-canary.1-57f349f63/bun-linux-x64.zip
          BUN_ARCHIVE_SHA256: 83144e2542c33aaae541cf16b42f8cf1c55c3b94c5395fc776417fa27e95bcbf
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bun.zip" "$BUN_ARCHIVE_URL"
          echo "$BUN_ARCHIVE_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Verify exact CI revision
        run: test "$(bun --revision)" = "1.4.0-canary.1+57f349f63"
      # The gate validates against a JSON schema (ajv), so the lockfile is installed.
      - run: bun install --frozen-lockfile
      - name: Judge the brick map
        run: bun run check:briques

  vision-page:
    # A job of its own, so that a stale page and a red map are two verdicts.
    name: Vision page regenerated from the brick map, fail on drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install archived Bun toolchain
        env:
          BUN_ARCHIVE_URL: https://github.com/libre-ai/project-governance/releases/download/toolchain-bun-1.4.0-canary.1-57f349f63/bun-linux-x64.zip
          BUN_ARCHIVE_SHA256: 83144e2542c33aaae541cf16b42f8cf1c55c3b94c5395fc776417fa27e95bcbf
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bun.zip" "$BUN_ARCHIVE_URL"
          echo "$BUN_ARCHIVE_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Verify exact CI revision
        run: test "$(bun --revision)" = "1.4.0-canary.1+57f349f63"
      # The generator runs the gate (ajv), so the lockfile is installed.
      - run: bun install --frozen-lockfile
      - name: Regenerate the vision page and fail on drift
        run: |
          # The generator exits non-zero on a red map: no page from a map with a violation.
          bun run build:vision
          # intent-to-add makes a NEW generated file visible to git diff;
          # without it, an uncommitted new surface would pass silently.
          git add --intent-to-add distribution/vision
          if ! git diff --stat --exit-code -- distribution/vision; then
            echo "::error::distribution/vision is stale — run 'bun run build:vision' and commit the result"
            exit 1
          fi
          # The page and its stylesheet, as two regular files, and nothing else.
          # The data inventory does not see a file whose extension is source to
          # it, and neither it nor the diff above sees a symbolic link put in
          # the place of the page. Index entries are compared, mode included:
          # git quotes a name that holds a line break, so a name cannot forge a line.
          tracked="$(git ls-files --format='%(objectmode) %(path)' -- distribution/vision)"
          expected="$(printf '100644 distribution/vision/index.html\n100644 distribution/vision/vision.css')"
          if [ "$tracked" != "$expected" ]; then
            echo "::error::distribution/vision must hold the page and its stylesheet as two regular files, and nothing else; the index holds:"
            echo "$tracked"
            exit 1
          fi
