name: Brick map

# The brick map (ADR-0064) is data: eleven layer files and one fiche per brick
# under ecosystem/briques/. This workflow runs its gate on the tree a pull
# request delivers and on every merged head, so the counters it prints (bricks
# per layer, derived status, proofs held) are attached to a commit.
#
# It is a workflow of its own, not a link of `bun run check`: ADR-0064 leaves
# to the owner the act of making this gate a required context, after the first
# data exists. Chained into the aggregate, it would have become required
# through `Bun quality` without that act.
on:
  push:
    # The served branch is listed, as in feeds-freshness.yml: with `[main]`
    # alone no verdict would ever be attached to a merged head.
    branches: [main, migrate/recover-code]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brick-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brick-map:
    name: Brick map layers, bricks and derived status
    runs-on: ubuntu-latest
    # The gate reads the index and a few doctrine files: seconds. A run that
    # lasts is a defect, and it fails closed here rather than at the runner's limit.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `bun install` runs after this step: the token is not left in the clone.
          persist-credentials: false
      - name: Install archived Bun toolchain
        env:
          BUN_ARCHIVE_URL: https://github.com/libre-ai/project-governance/releases/download/toolchain-bun-1.4.0-canary.1-57f349f63/bun-linux-x64.zip
          BUN_ARCHIVE_SHA256: 83144e2542c33aaae541cf16b42f8cf1c55c3b94c5395fc776417fa27e95bcbf
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bun.zip" "$BUN_ARCHIVE_URL"
          echo "$BUN_ARCHIVE_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Verify exact CI revision
        run: test "$(bun --revision)" = "1.4.0-canary.1+57f349f63"
      # The gate validates against a JSON schema (ajv), so the lockfile is installed.
      - run: bun install --frozen-lockfile
      - name: Judge the brick map
        run: bun run check:briques

  product-catalogue:
    # The product catalogue (ecosystem/produits/, one fiche per product of
    # ADR-0042 §1) is the data the brick map and the site are meant to read. A
    # job of its own, so that a red catalogue and a red map are two verdicts.
    # Not required, like the rest of this workflow: making it a required
    # context is an act of the owner.
    name: Product catalogue fiches, held to ADR-0042
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install archived Bun toolchain
        env:
          BUN_ARCHIVE_URL: https://github.com/libre-ai/project-governance/releases/download/toolchain-bun-1.4.0-canary.1-57f349f63/bun-linux-x64.zip
          BUN_ARCHIVE_SHA256: 83144e2542c33aaae541cf16b42f8cf1c55c3b94c5395fc776417fa27e95bcbf
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bun.zip" "$BUN_ARCHIVE_URL"
          echo "$BUN_ARCHIVE_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Verify exact CI revision
        run: test "$(bun --revision)" = "1.4.0-canary.1+57f349f63"
      # The gate validates against a JSON schema (ajv), so the lockfile is installed.
      - run: bun install --frozen-lockfile
      - name: Judge the product catalogue
        run: bun run check:produits

  vision-page:
    # A job of its own, so that a stale page and a red map are two verdicts.
    #
    # ADR-0064 D6, amended on 2026-11-23 (owner decision): a pull request does
    # not regenerate the page. While each one did, every pull request that
    # touched the brick map conflicted with the next on this generated file,
    # and the served branch requires an up-to-date pull request, so each merge
    # cost a hand regeneration and a full CI run on every pull request queued
    # behind it. The page stays tracked and is regenerated by a pull request of
    # its own, once per batch:
    # - every pull request: the page must build (no page from a red map);
    # - a pull request that changes the page changes nothing else, and its page
    #   equals the regeneration;
    # - a merged head whose page is behind the map gets a warning, not a red.
    name: Vision page builds from the brick map, regenerated by its own pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # On a pull request the checkout is the merge commit: its first parent
          # is the base, so `HEAD^1..HEAD` is what the pull request changes.
          fetch-depth: 2
      - name: Install archived Bun toolchain
        env:
          BUN_ARCHIVE_URL: https://github.com/libre-ai/project-governance/releases/download/toolchain-bun-1.4.0-canary.1-57f349f63/bun-linux-x64.zip
          BUN_ARCHIVE_SHA256: 83144e2542c33aaae541cf16b42f8cf1c55c3b94c5395fc776417fa27e95bcbf
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bun.zip" "$BUN_ARCHIVE_URL"
          echo "$BUN_ARCHIVE_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Verify exact CI revision
        run: test "$(bun --revision)" = "1.4.0-canary.1+57f349f63"
      # The generator runs the gate (ajv), so the lockfile is installed.
      - run: bun install --frozen-lockfile
      - name: Build the vision page, judge a regeneration pull request, report drift
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # The generator exits non-zero on a red map: no page from a map with a violation.
          bun run build:vision
          # intent-to-add makes a NEW generated file visible to git diff;
          # without it, an uncommitted new surface would pass silently.
          git add --intent-to-add distribution/vision
          drift=0
          git diff --quiet -- distribution/vision || drift=1
          if [ "$EVENT_NAME" = pull_request ]; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
            count="$(printf '%s\n' "$changed" | grep -c . || true)"
            if printf '%s\n' "$changed" | grep -qx 'distribution/vision/index.html'; then
              outside="$(printf '%s\n' "$changed" | grep -v '^distribution/vision/' || true)"
              if [ -n "$outside" ]; then
                echo "::error::a pull request that regenerates the vision page changes nothing else (ADR-0064 D6); it also changes:"
                echo "$outside"
                exit 1
              fi
              if [ "$drift" = 1 ]; then
                git diff --stat -- distribution/vision
                echo "::error::this regeneration pull request does not hold the page the brick map builds — run 'bun run build:vision' on its base and commit the result alone"
                exit 1
              fi
              echo "Regeneration pull request: ${count} changed path(s), all under distribution/vision/; the page equals the regeneration."
            else
              echo "This pull request does not change the page (${count} changed path(s); page behind the map after it: ${drift}). The page is regenerated by a pull request of its own (ADR-0064 D6)."
            fi
          elif [ "$drift" = 1 ]; then
            git diff --stat -- distribution/vision
            echo "::warning::distribution/vision is behind the brick map — open a pull request that only runs 'bun run build:vision' and commits the result"
          else
            echo "The tracked page equals the regeneration."
          fi
          # The page and its stylesheet, as two regular files, and nothing else.
          # The data inventory does not see a file whose extension is source to
          # it, and neither it nor the diff above sees a symbolic link put in
          # the place of the page. Index entries are compared, mode included:
          # git quotes a name that holds a line break, so a name cannot forge a line.
          tracked="$(git ls-files --format='%(objectmode) %(path)' -- distribution/vision)"
          expected="$(printf '100644 distribution/vision/index.html\n100644 distribution/vision/vision.css')"
          if [ "$tracked" != "$expected" ]; then
            echo "::error::distribution/vision must hold the page and its stylesheet as two regular files, and nothing else; the index holds:"
            echo "$tracked"
            exit 1
          fi
