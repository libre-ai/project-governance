name: Validate source composition

'on':
  workflow_call:
    inputs:
      target:
        description: Exact destination repository name
        required: true
        type: string
      target_ref:
        description: Full target commit ID to validate
        required: true
        type: string
      tooling_ref:
        description: Full governance tooling commit ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      INPUT_TARGET: ${{ inputs.target }}
      INPUT_TARGET_REF: ${{ inputs.target_ref }}
      INPUT_TOOLING_REF: ${{ inputs.tooling_ref }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Validate exact target and revisions before checkout
        id: inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          targets = {
              'project-governance', 'schemas-and-contracts', 'ai-work-supervision',
              'application-development-toolkit', 'organization-data-lifecycle',
              'ai-model-policy', 'learning-session-facilitation',
              'personal-knowledge-workspace',
              'travel-itinerary-planner', 'collaborative-data-sync',
              'execution-continuity-evaluator', 'execution-sandbox',
              'capability-authorization', 'database-policy-inspector',
              'artifact-verification', 'project-website',
          }
          if os.environ['INPUT_TARGET'] not in targets:
              raise SystemExit('Unknown composition target')
          for key in ('INPUT_TARGET_REF', 'INPUT_TOOLING_REF'):
              if re.fullmatch(r'[0-9a-f]{40}', os.environ[key]) is None:
                  raise SystemExit('A full lowercase commit ID is required')
          PY

      - name: Checkout immutable governance tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: libre-ai/project-governance
          ref: ${{ inputs.tooling_ref }}
          path: tooling
          persist-credentials: false
          fetch-depth: 1

      - name: Test the composition tooling
        shell: bash
        run: python3 -B -m unittest discover -s tooling/.github/composition -p 'test_*.py'

      - name: Prepare all source checkouts before installation
        shell: bash
        run: |
          python3 -B tooling/.github/composition/run-composition.py \
            --target "$INPUT_TARGET" --revision "$INPUT_TARGET_REF" \
            --root "$GITHUB_WORKSPACE/composition" --phase prepare

      # SCRATCH PROOF ONLY (branch artifacts-proof, never merged): plant
      # evidence, a node_modules decoy and a hidden file, then fail.
      - name: Scratch proof - plant evidence and fail
        shell: bash
        run: |
          base="$GITHUB_WORKSPACE/composition/$INPUT_TARGET"
          mkdir -p "$base/proof-a/test-results/case-firefox" "$base/proof-b/playwright-report" "$base/node_modules/decoy/test-results"
          printf 'trace' > "$base/proof-a/test-results/case-firefox/trace.zip"
          printf '{}' > "$base/proof-a/test-results/.last-run.json"
          printf '<html></html>' > "$base/proof-b/playwright-report/index.html"
          printf 'decoy' > "$base/node_modules/decoy/test-results/trace.zip"
          exit 1

      - name: Install verified Bun and Node toolchains
        shell: bash
        run: |
          bash tooling/.github/composition/install-toolchains.sh \
            "$GITHUB_WORKSPACE/composition/project-governance/toolchains/bun.json" \
            "$GITHUB_WORKSPACE/composition/project-governance/toolchains/notebook-qualification.json"

      # docs/security/ADVISORY-WAIVER-POLICY.md: every waived advisory is dated,
      # referenced and bounded, verified by a required gate. Run on the target's
      # tracked files before the install-and-check phase, from the tooling
      # generation the caller pinned. It never fetches an advisory database; the
      # only clock-dependent verdict (a passed expiry) is announced 30 days ahead.
      - name: Advisory waiver discipline
        shell: bash
        run: |
          bun tooling/tools/quality/check-advisory-waivers.ts \
            --root="$GITHUB_WORKSPACE/composition/$INPUT_TARGET"

      - name: Install Rust compiler and required components
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown

      - name: Install artifact coverage tool
        if: inputs.target == 'artifact-verification'
        shell: bash
        run: cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Install licensing checker
        shell: bash
        run: pipx install reuse==6.2.0

      - name: Install frozen composition, build UI and run target root checks
        shell: bash
        run: |
          python3 -B tooling/.github/composition/run-composition.py \
            --target "$INPUT_TARGET" --revision "$INPUT_TARGET_REF" \
            --root "$GITHUB_WORKSPACE/composition" --phase check

      - name: Preload locked native dependencies
        if: inputs.target == 'ai-model-policy' || inputs.target == 'personal-knowledge-workspace'
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/composition/$INPUT_TARGET"
          cargo fetch --locked

      - name: Run native product tests
        if: inputs.target == 'ai-model-policy' || inputs.target == 'personal-knowledge-workspace'
        shell: bash
        run: |
          python3 -B tooling/.github/composition/check-products.py \
            --root "$GITHUB_WORKSPACE/composition" --target "$INPUT_TARGET" --gate native \
            --bun "$(command -v bun)" --cargo "$(command -v cargo)" --node "$(command -v node)"

      - name: Build and verify current product WASM
        if: inputs.target == 'ai-model-policy' || inputs.target == 'personal-knowledge-workspace'
        shell: bash
        run: |
          python3 -B tooling/.github/composition/check-products.py \
            --root "$GITHUB_WORKSPACE/composition" --target "$INPUT_TARGET" --gate wasm \
            --bun "$(command -v bun)" --cargo "$(command -v cargo)" --node "$(command -v node)"

      - name: Install browsers for the selected product
        if: contains(fromJSON('["ai-work-supervision","personal-knowledge-workspace","project-website"]'), inputs.target)
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          children = {
              'ai-work-supervision': 'packages/auth-web',
              'personal-knowledge-workspace': 'apps/notebook',
              'project-website': '',
          }
          target = os.environ['INPUT_TARGET']
          cwd = Path(os.environ['GITHUB_WORKSPACE']) / 'composition' / target / children[target]
          subprocess.run(
              ['bun', 'x', '--no-install', 'playwright', 'install', '--with-deps',
               'chromium', 'firefox', 'webkit'],
              cwd=cwd, check=True, timeout=900,
          )
          PY

      - name: Run selected browser suite sequentially
        if: contains(fromJSON('["ai-work-supervision","personal-knowledge-workspace","project-website"]'), inputs.target)
        shell: bash
        run: |
          python3 -B tooling/.github/composition/check-products.py \
            --root "$GITHUB_WORKSPACE/composition" --target "$INPUT_TARGET" --gate e2e \
            --bun "$(command -v bun)" --cargo "$(command -v cargo)" --node "$(command -v node)"

      - name: Install toolkit browsers
        if: inputs.target == 'application-development-toolkit'
        working-directory: composition/application-development-toolkit/packages/ui
        shell: bash
        run: bun x --no-install playwright install --with-deps chromium firefox webkit

      - name: Build and exercise toolkit applications
        if: inputs.target == 'application-development-toolkit'
        working-directory: composition/application-development-toolkit
        shell: bash
        run: |
          bun run build
          bun run check:e2e

      # A red browser suite left nothing behind: this job uploaded no artifact,
      # so the Firefox COOP hang (F2) could only be studied by reproducing it
      # locally. The inventory always runs and prints the volume it found, so
      # "the suite wrote no trace" stays distinguishable from "nothing was
      # looked at". Both steps are gated on the input validation: once it has
      # failed, `inputs.target` is unvalidated and must not become a path.
      - name: Inventory browser evidence
        if: always() && steps.inputs.outcome == 'success'
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          root = workspace / 'composition' / os.environ['INPUT_TARGET']
          # Mirrors the upload globs: installed packages ship their own
          # `test-results` fixtures, which are not evidence of this run.
          pruned = {'node_modules', '.git'}
          directories, traces, files, size = [], 0, 0, 0
          if root.is_dir():
              for current, children, names in os.walk(root):
                  children[:] = sorted(name for name in children if name not in pruned)
                  base = Path(current)
                  if base.name in ('test-results', 'playwright-report'):
                      directories.append(str(base.relative_to(workspace)))
                  inside = any(part in ('test-results', 'playwright-report') for part in base.relative_to(root).parts)
                  for name in names:
                      if name.startswith('.') or not inside:
                          continue
                      files += 1
                      size += (base / name).lstat().st_size
                      traces += name == 'trace.zip'
          summary = {
              'schemaVersion': 'libre-ai.e2e-evidence-inventory.v1',
              'target': os.environ['INPUT_TARGET'],
              'runAttempt': int(os.environ['RUN_ATTEMPT']),
              'jobStatus': os.environ['JOB_STATUS'],
              'compositionPresent': root.is_dir(),
              'evidenceDirectories': directories,
              'traceArchives': traces,
              'files': files,
              'bytes': size,
          }
          text = json.dumps(summary, indent=2)
          (workspace / 'e2e-evidence-summary.json').write_text(text + '\n', encoding='utf-8')
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write(
                  f"Browser evidence: {len(directories)} directories, {traces} trace archives, "
                  f"{files} files ({size} bytes) under composition/{summary['target']}.\n"
              )
          PY

      # Traces hold page snapshots and network bodies of the locally spawned
      # test servers only: this job receives no secret, and hidden files (the
      # `.last-run.json` index, Playwright scratch directories) stay excluded by
      # the action's default. Every `trace.zip` written by `retain-on-failure`
      # lives under a project `test-results` output directory, which the first
      # glob already covers.
      - name: Upload browser evidence of a red run
        if: (failure() || cancelled()) && steps.inputs.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ inputs.target }}-${{ github.run_attempt }}
          path: |
            e2e-evidence-summary.json
            composition/${{ inputs.target }}/**/test-results/**
            composition/${{ inputs.target }}/**/playwright-report/**
            !composition/${{ inputs.target }}/**/node_modules/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Record the validation boundary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          This job validates the selected target and its pinned local source composition.
          Root, native, WASM and browser steps report their own outcomes; a skipped step is not a passed gate.
          Existing macOS Notebook evidence does not qualify this Linux execution.
          No Harness-wide coverage, deployment or package publication is claimed.
          EOF
