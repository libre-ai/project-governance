name: pr-door

# Door gate (tools/quality/check-pr-door.ts): every pull request description
# declares `Door: one-way|two-way`, and a one-way door names its
# `Second-instrument:` (gate-integrity §3). A workflow of its own rather than a
# step of ci.yml: the declaration lives in the description, so the gate must
# re-run when the description is `edited`, which ci.yml does not listen to —
# and re-running the whole CI on every description edit would be the cost of
# that wiring, not its point.
#
# The description is read from the event payload file by the gate, never
# interpolated into a shell command: it is author-controlled text.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-door-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  door:
    name: Door declaration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install archived Bun toolchain
        env:
          BUN_ARCHIVE_URL: https://github.com/libre-ai/project-governance/releases/download/toolchain-bun-1.4.0-canary.1-57f349f63/bun-linux-x64.zip
          BUN_ARCHIVE_SHA256: 83144e2542c33aaae541cf16b42f8cf1c55c3b94c5395fc776417fa27e95bcbf
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bun.zip" "$BUN_ARCHIVE_URL"
          echo "$BUN_ARCHIVE_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Verify the exact Bun revision
        run: test "$(bun --revision)" = "1.4.0-canary.1+57f349f63"
      - run: bun run check:pr-door
