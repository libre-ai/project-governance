name: Toolchain freshness

# Weekly report, read-only: a toolchain pin of this repository (Bun, the Rust
# toolchain, cargo-deny, cargo-audit, cargo-semver-checks, cargo-llvm-cov,
# cargo-mutants, reuse, shellcheck, osv-scanner) that is behind the latest
# release its tool publishes. A pin only moves when someone moves it, and no
# other gate turns red while it ages: the gates compare the copies of a pin
# with each other, never with the world.
#
# The detection lives in tools/fleet/check-toolchain-freshness.ts (unit-tested,
# documented in docs/toolchain/TOOLCHAIN-FRESHNESS.md). It reads where each tool
# is published, sends no mutation and files no issue: a pin is moved by a pull
# request, by hand. The only write of this workflow is the repeat-failure issue
# on this repository, below.
#
# Not a pull request gate on purpose: a tool publishing a release is not a
# defect of the change under review.
on:
  schedule:
    - cron: "27 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  toolchain-freshness:
    name: Toolchain pins against the latest releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install archived Bun toolchain
        env:
          BUN_ARCHIVE_URL: https://github.com/libre-ai/project-governance/releases/download/toolchain-bun-1.4.0-canary.1-57f349f63/bun-linux-x64.zip
          BUN_ARCHIVE_SHA256: 83144e2542c33aaae541cf16b42f8cf1c55c3b94c5395fc776417fa27e95bcbf
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bun.zip" "$BUN_ARCHIVE_URL"
          echo "$BUN_ARCHIVE_SHA256  $RUNNER_TEMP/bun.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Verify exact CI revision
        run: test "$(bun --revision)" = "1.4.0-canary.1+57f349f63"
      # Bun built-ins and repository-local imports only, no `bun install`: the
      # report stays independent from the dependency supply chain, like
      # fleet-staleness.yml. The token is sent to api.github.com alone, for the
      # two tools that publish on GitHub Releases only; every other read is
      # anonymous.
      - name: Compare every toolchain pin with the latest release of its tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tools/fleet/check-toolchain-freshness.ts
      # A red run here is only visible to someone who opens the Actions tab
      # (AGENTIC-LOOP-INVENTORY.md). One red run stays a run; two in a row
      # files a deduplicated governance issue.
      - name: File an issue if this is the second consecutive failed run
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Toolchain freshness
          WORKFLOW_FILE: toolchain-freshness.yml
          CURRENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun tools/security/repeat-failure-alert.ts
      # The green run closes the issue the alert opened (idempotent: nothing
      # open, nothing closed), so the issue never outlives the failure.
      - name: Close the repeat-failure issue now that the loop is green
        if: success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Toolchain freshness
          WORKFLOW_FILE: toolchain-freshness.yml
          CURRENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun tools/security/repeat-failure-alert.ts --resolve
