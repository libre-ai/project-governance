schema_version: libre-ai.legacy-manifest.v1
observed_at: 2026-07-16
policy:
  import_git_history: false
  canonical_after_freeze: libre-ai/libre-ai
  preserve_archives: true
  # Amended 2026-07-19 (ADR-0008): preservation of the removed repositories
  # moved off GitHub to owner-held full mirrors and verified `git bundle --all`
  # snapshots plus a complete export of the non-git GitHub data (issues, pull
  # request conversations, reviews, releases and their uploaded assets),
  # captured immediately before removal. Retained product repositories stay
  # frozen on GitHub as reserved future product homes.
  archive_medium: owner-held-mirrors-bundles-and-metadata-exports
github_cleanup:
  performed_on: 2026-07-19
  authorized_by: owner
  reference: docs/adr/0008-multi-repo-target-topology-and-brand.md
  rationale: >-
    Public-presence cleanup. The frozen repositories surfaced stale product
    visions as the organization's first search results. Per ADR-0008 the
    product repositories are retained as reserved future product homes with a
    freeze-notice banner, and the legacy tooling repositories are removed;
    their responsibilities live in the canonical base repository.
  retained_product_repositories:
    treatment: >-
      One docs-only freeze-notice commit (banner and description) added on top
      of each freeze revision through a checked pull request on 2026-07-19,
      then re-archived. The recorded freeze revisions below remain the freeze
      record.
  removed_repositories:
    capture_verified: >-
      Every freeze revision below confirmed present in its mirror before
      removal; every mirror HEAD equalled the live remote HEAD at capture; all
      bundles pass `git bundle verify`; 86 pull requests, 5 issues, reviews,
      10 releases and 70 uploaded release assets exported. The agent-factory
      post-freeze candidate f52dc5a (legacy PR #32) is captured in its mirror;
      the proof-kit post-freeze candidate 5bd48f3 was never pushed to GitHub
      and is preserved as a patch in the 2026-07-18 candidate archive.
reactivation:
  performed_on: 2026-07-23
  authorized_by: owner
  reference: docs/adr/0008-multi-repo-target-topology-and-brand.md
  rationale: >-
    The reserved product homes move from frozen (archived, freeze-notice banner)
    to reserved-active: unarchived, issues disabled, each carrying a living
    bilingual README that states what the product is, what already exists in the
    base repository (with links), and where the work happens. The recorded freeze
    revisions below remain the freeze record; the github_status
    frozen-reserved-product-home becomes reserved-active-product-home, and
    agent-board is renamed to missions (its URL redirects).
