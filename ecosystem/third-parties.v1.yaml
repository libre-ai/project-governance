# Registre des tiers de service de la flotte et de leur exercice de sortie.
#
# STATUT : PROPOSÉ (ADR-0070). Aucune date ni procédure de ce fichier n'est un
# engagement du propriétaire tant qu'ADR-0070 n'est pas accepté. Chaque
# `planned_on` est une date proposée. Chaque procédure sous
# `docs/security/third-party-exits/` est une procédure proposée, jamais exécutée.
#
# Forme, lue par `tools/quality/check-third-parties.ts` :
#   id                             third-party.<mots en minuscules joints par un tiret>
#   subject                        ce dont la flotte dépend
#   exit_exercise.planned_on       date prévue, AAAA-MM-JJ
#   exit_exercise.procedure        fichier suivi du dépôt qui décrit l'exercice
#   exit_exercise.last_executed_on date de la dernière exécution, ou null
#
# Style imposé : clés nues, en bloc, sans valeur sur plusieurs lignes.
# Retirer une entrée desserre le contrôle : ce fichier est sur la surface de
# `tools/quality/check-review-evidence.ts`.
schema_version: libre-ai.third-parties.v1
third_parties:
