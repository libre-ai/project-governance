schema_version: libre-ai.produit.v1
id: P39
nom_public: "Cours"
nom_provisoire: null
intitule: "activités pédagogiques"
fonction: "Activités pédagogiques en direct"
categorie: pedagogie
promesse: "Permettre à un formateur, un enseignant ou un animateur de construire une expérience collective à partir de connaissances vérifiables, puis de prolonger l’apprentissage individuellement."
pour_qui: "un formateur, un enseignant ou un animateur (fiche) ; le propriétaire, animateurs et groupes (catalogue)"
a_la_place_de: "votre outil de quiz et de sondages en direct par abonnement"
capacites:
  - "Créer un projet pédagogique, préciser public, prérequis et objectifs observables, joindre les sources autorisées et produire un déroulé."
  - "Catalogue extensible d'activités : QCM, réponse courte, question ouverte, classement, association, sondage, nuage de mots, contributions sur tableau et simulation de situation."
  - "Créer une session avec état explicite, mode présentateur et vue participant ; entrée par code ou QR selon la politique choisie."
  - "L’animateur ouvre, suspend et clôt une activité, modère les contributions et choisit ce qui est projeté."
  - "Après une session, offrir un dossier de ressources et des exercices rejouables selon les droits accordés."
  - "Générer des propositions d’activités, expliquer une correction et synthétiser les thèmes d’un échange."
ne_fait_pas:
  - "La participation et la qualité des apprentissages priment sur la seule accumulation de points."
  - "Les codes expirent et ne valent pas accès à toutes les sources du projet."
  - "Ne pas déduire une aptitude, une personnalité ou un diagnostic à partir de la participation."
  - "Un score pédagogique ne constitue pas une certification."
  - "Les sondages d’opinion n’ont pas de bonne réponse artificielle."
  - "Le JdR de loisir P32 ne doit pas devenir une dépendance nécessaire aux simulations pédagogiques."
