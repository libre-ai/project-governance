schema_version: libre-ai.produit.v1
id: P03
nom_public: "Corpus"
nom_provisoire: null
intitule: "entretien du corpus bibliographique"
fonction: "Assistant de bibliothèque Zotero"
categorie: connaissance
promesse: "Aider à comprendre et entretenir une bibliothèque scientifique au service de questions explicites, en renforçant le gestionnaire bibliographique existant par l'exploration, la qualification et la veille, sans recréer la gestion bibliographique."
pour_qui: "Chercheurs utilisant Zotero"
a_la_place_de: "le tri et le nettoyage à la main de votre bibliothèque de références (le produit complète votre gestionnaire bibliographique, il ne le remplace pas)"
capacites:
  - "Sélectionner une collection, formuler son objectif de recherche et construire un état du corpus : références, pièces, annotations, versions et sujets."
  - "Explorer un papier, ses références, les travaux qui le citent, les auteurs et les méthodes ; comparer les contributions."
  - "Repérer doublons certains et candidats, prépublications et versions publiées, métadonnées contradictoires, pièces manquantes, références sans texte disponible et éléments hors périmètre."
  - "Partir d'une question, montrer ce que le corpus permet déjà d'établir, où manquent les preuves et quels travaux contradictoires méritent lecture, avec renvoi à la page, section ou citation."
  - "Proposer les statuts « à lire », « référence », « à réexaminer », « hors périmètre » et « à archiver », chaque suggestion expliquant ses indices et son incertitude."
  - "Produire un rapport préalable de nettoyage puis appliquer les choix validés de façon réversible ; transformer les pistes pertinentes en veille P02."
ne_fait_pas:
  - "Ne pas recréer sans raison la gestion bibliographique existante."
  - "Une similarité de titre n'autorise pas seule une fusion."
  - "Les corrections ou rétractations ne sont affichées comme établies que sur source vérifiée ; leur absence de détection ne certifie rien."
  - "La qualité scientifique ne se réduit ni à l'âge, ni au nombre de citations, ni au prestige d'une revue."
  - "Ne jamais écraser une version plus récente sans résolution."
  - "Synchronisation bidirectionnelle seulement pour les champs et opérations déclarés."
  - "Les cas ambigus restent proposés et ne sont pas fusionnés automatiquement."
  - "La diminution du nombre de papiers n'est pas une mesure de réussite."
depend_de:
  - P01
realisation: "intégration"
depot: libre-ai/personal-knowledge-workspace
etiquettes:
  - "Connecté à Zotero"
  - "Références et citations"
  - "Nettoyage du corpus"
a_relire:
  - a_la_place_de
  - depend_de
