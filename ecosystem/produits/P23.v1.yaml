schema_version: libre-ai.produit.v1
id: P23
nom_public: null
nom_provisoire: "Prototype"
intitule: "conception et prototypage"
fonction: "Prototypage produit"
categorie: creation-publication
promesse: "Un atelier où l'on peut comprendre, essayer et décider d'une évolution produit avec une traçabilité jusqu'à sa réalisation."
pour_qui: "Un concepteur ou un développeur"
a_la_place_de: "votre outil de maquettage et de prototypage d'interfaces en ligne, où chaque personne qui modifie une maquette est facturée"
capacites:
  - "Inventaire du design system avec provenance fichier/révision, composants, tokens, contraintes d'accessibilité et exemples."
  - "Cartographie de parcours, états vides et d'erreur, comportements métier et alternatives."
  - "Prototypes manipulables utilisant les composants réellement présents lorsque compatibles ; les composants simulés sont signalés."
  - "Comparaison côte à côte des variantes et commentaires ancrés sur un écran, état ou comportement."
  - "Chaque choix important associe problème, options, conséquence, décision et version validée."
  - "Dossier de réalisation : spécification comportementale, critères d'acceptation, code du prototype, dépendances et liens vers les tickets."
  - "Exécution des prototypes dans un bac à sable dont les restrictions sont vérifiées : système de fichiers, réseau, ressources et secrets."
ne_fait_pas:
  - "Le modèle ne sélectionne pas silencieusement une architecture."
  - "Une instruction trouvée dans le dépôt ou un composant importé ne peut autoriser une action sur des secrets ou des comptes."
  - "Ne modifie pas le dépôt de production : lit la révision source."
  - "Pas d'accès implicite aux variables et identifiants de la machine."
  - "Ne réutilise pas le statut d'une validation après un changement ultérieur du prototype : les validations concernées sont invalidées."
  - "Ne fait pas passer un prototype dans le code produit sans intégration explicite, avec revue, tests et contrôles."
depend_de:
  - P14
realisation: "projet autonome"
depot: null
etiquettes:
  - "Depuis votre code"
  - "Composants réutilisés"
  - "Spécification transmise"
a_relire:
  - a_la_place_de
