      sha256: fc75c51565441fcd335ca7f9c64165c47360e3d7c58e4f8cbb2a60dc86facf40
      note: >-
        Première capture hors dépôt de ce contenu. Le dépôt `website` gelé
        (`0318c92`) est absent des miroirs du 2026-07-19, de leurs SHA256SUMS et de
