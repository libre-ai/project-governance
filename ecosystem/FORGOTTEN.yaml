      `status: ready-for-dev` et `Status: review` sans qualification historique : ouverts
      directement, ils se présentaient comme des spécifications courantes. Zéro référence
      entrante dans le dépôt.
    decided_by: owner
    decided_on: 2026-07-28
    adr: ADR-0019
    recoverable_at: 67571bf00593073d3bb121a7a08536f83b7c76b2
    external_capture:
