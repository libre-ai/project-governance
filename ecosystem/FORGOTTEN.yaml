# Registre d'oubli — contenu retiré de l'arbre de travail par décision propriétaire.
#
# Une doctrine morte qui reste greppable revient : un agent la retrouve, lit son
# `status: final` et la ressuscite comme si elle était vivante. INVARIANTS.md porte
# déjà cette primitive pour la doctrine (« ce qui n'y figure pas n'est pas doctrine ») ;
# ce registre la porte pour le contenu. Autorité : ADR-0019.
#
# L'oubli est une éviction, pas une destruction : le contenu reste dans l'historique du
# dépôt à `recoverable_at`. Ce qui disparaît est le vecteur de contamination réel —
# `grep`, `find`, la lecture opportuniste d'un agent — pas l'existence.
#
# Restaurer exige une décision propriétaire et le retrait de l'entrée correspondante.
# `bun run check:forgotten` interdit la résurrection et la citation.

version: 1

# Where `recoverable_at` commits resolve. Since the governance split
# (ADR-0020), this repository's history is a filtered rewrite: the anchors
# live in the hub archive, and the guard resolves them there (GitHub API)
# when they are absent locally. Offline, that verification is explicitly
# skipped with a warning — CI always has the network and always verifies.
anchor_repository: libre-ai/libre-ai

entries:
