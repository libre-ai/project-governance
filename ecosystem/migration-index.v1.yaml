# Index de migration — institué par ADR-0020 §2.6 (activation générale).
#
# Chaque chemin qui quitte le hub est tracé ici : destination (repo cible) et
# SHA du premier commit de destination portant le contenu migré. La règle dure
# de bascule s'applique : un chemin ne quitte le hub qu'après preuve verte côté
# destination — jamais de fenêtre où un contenu n'existe nulle part en vert.
#
# Le gate d'orphelins (à câbler avec le système de fiches, design §3.6/§7.2)
# échoue si un chemin suivi du hub n'a ni entrée ici, ni place déclarée dans la
# topologie cible (design §4), ni entrée au registre d'oubli. Migré ≠ oublié
# (I-23) : ce fichier est l'inverse fonctionnel d'ecosystem/FORGOTTEN.yaml —
# le contenu migré a une destination vivante.
#
# Entrées de forme :
# Un hub_path peut apparaître dans PLUSIEURS entrées (une par couple
# chemin × destination) : l'outillage partagé essaime — le gate d'orphelins
# vérifie qu'un chemin a AU MOINS une destination, cette carte les liste
# TOUTES pour décrire la topologie réelle (finding K4 AUTH-02).
#   - hub_path: <chemin du hub, préfixe>
#     destination: libre-ai/<repo>
#     destination_commit: <SHA du PREMIER commit de destination portant le
#       contenu migré — immuable une fois écrit>
#     verified_at_commit: <dernier commit de destination dont les gates sont
#       mesurés verts — avance avec les preuves (K4 AUTH-R2-01)>
#     destination_path: <chemin du contenu à destination quand il diffère du
#       hub_path — « . » pour un renommage à la racine ; absent = identique.
#       Mapping MACHINE du gate de dérive hub↔destination (K4 AUTH-05)>
#     hub_removal_commit: <SHA du commit du hub qui retire le chemin,
#       ou `pending` — état intermédiaire : contenu porté et vert à
#       destination, chemin pas encore retiré du hub (la règle dure de
#       bascule autorise la double présence, jamais l'absence)>
#     notes: <bornes, exemptions tracées — ex. borne DCO de greffe>
#
# Provenance (2026-08-18) : ce fichier est une synchronisation manuelle
# depuis l'index d'autorité du hub (`libre-ai/libre-ai:ecosystem/migration-index.v1.yaml`,
# blob `a66b0b49…`, dernier commit `3f03b94d…` du 2026-07-30T15:06:29Z), qui
# est resté l'autorité vivante pendant le démantèlement (γ 3.3 à 3.8) et l'est
# encore techniquement, même si le hub est désormais archivé (lecture seule
# définitive) et ne peut donc plus avancer. La copie précédente ici datait de
# γ 3.3 (56 entrées, toutes `pending`) ; `check-migration-drift.ts` lit déjà
# l'index d'autorité en réseau et n'utilise pas cette copie pour ses
# assertions — elle sert la lecture humaine. Re-synchroniser seulement si
# l'archive du hub est elle-même amendée (ce qu'elle ne devrait plus être).

