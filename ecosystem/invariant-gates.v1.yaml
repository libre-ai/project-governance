schema_version: libre-ai.invariant-gates.v1
# Reviewed correspondence invariant -> gate -> test, read by
# ecosystem/render-invariant-matrix.ts. docs/decisions/INVARIANTS.md stays the
# only authority on the invariants: this file carries no rule text, no
# applicability, no date and no source.
#
# One entry per invariant in force, exactly. `gates` lists the local, tracked
# files that enforce it, each with the tracked test that names it, or `test: null`.
# `gates: []` says that no gate holds the invariant: the projection shows it as
# "sans gate". Adding a pair asserts that a gate holds an invariant: a review
# judgment, not a formality.
