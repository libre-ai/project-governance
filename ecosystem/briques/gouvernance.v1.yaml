schema_version: libre-ai.brique.v1
couche: gouvernance
# Couche sans dépendance vers une autre couche (ADR-0064 D1) : tout `depend_de`
# est vide ou ne nomme que des briques `GOV-…`. Toute écriture sur ces briques
# tombe sur la surface à touche humaine d'I-17 : un agent y propose, le
# propriétaire décide (`autonomie: discover`).
briques:
  - id: GOV-01
    nom: Propriétaire, agents, gates
    role: "Répartit les actes entre le propriétaire, qui signe la surface à touche humaine, les agents, qui écrivent sous les gates, et les gates, qui refusent ce qui n'est pas prouvé."
    depend_de: []
    invariants: [I-13, I-17, I-24]
    decisions: [ADR-0009, ADR-0022, ADR-0043, D31, D68]
    depots: [libre-ai/project-governance]
    origine:
      type: inspection
      source: vision externe en briques inspectée le 2026-11-09 (analyse hors dépôt) ; forme reprise, contenu réécrit depuis la doctrine Libre AI
    autonomie: discover
    preuve:
      - date: "2026-11-11"
        cible: tools/quality/check-review-evidence.ts
  - id: GOV-02
    nom: Invariants en couches
    role: "Tient le registre des invariants comme seule liste de la doctrine et rattache chaque invariant à la couche et à la classe de dépôt qu'il lie."
    depend_de: [GOV-01]
    invariants: [I-03, I-17]
    decisions: [ADR-0008, D103]
    depots: [libre-ai/project-governance]
    origine:
      type: inspection
      source: vision externe en briques inspectée le 2026-11-09 (analyse hors dépôt) ; forme reprise, contenu réécrit depuis la doctrine Libre AI
    autonomie: discover
    preuve:
      - date: "2026-10-14"
        cible: tools/quality/check-doctrine-governance.sh
  - id: GOV-03
    nom: Dégel et retrait de produit
    role: "Fait sortir un produit du gel, ou le retire du portefeuille, sur un fait observable écrit dans sa charte et sur une décision du propriétaire consignée au registre."
    depend_de: [GOV-01]
    invariants: [I-14, I-17, I-27]
    # ADR-0064 est cité pour sa décision D2 (charte : fait de dégel, fait
    # d'abandon), et la fiche le dit proposé.
    decisions: [ADR-0042, ADR-0052, ADR-0054, ADR-0055, ADR-0064, D53, D76, D80, D89, D94]
    depots: [libre-ai/project-governance]
    origine:
      type: inspection
      source: vision externe en briques inspectée le 2026-11-09 (analyse hors dépôt) ; forme reprise, contenu réécrit depuis la doctrine Libre AI
    autonomie: discover
    preuve:
      - date: "2026-10-09"
        cible: ecosystem/check-inventory-drift.ts
  - id: GOV-04
    nom: Registre d'admission des modèles
    role: "Tient la liste des modèles qu'un produit peut appeler et rend un verdict de refus par défaut pour tout modèle dont un fait requis manque."
    depend_de: [GOV-01]
    # Le registre des invariants, lu le 2026-11-11, ne porte aucune règle
    # d'admission d'un modèle. ADR-0063, proposé, la renvoie à un ADR candidat
    # distinct.
    invariants: []
    decisions: [ADR-0042, ADR-0063]
    depots: [libre-ai/ai-model-policy]
    origine:
      type: inspection
      source: vision externe en briques inspectée le 2026-11-09 (analyse hors dépôt) ; forme reprise, contenu réécrit depuis la doctrine Libre AI
    autonomie: discover
    preuve:
      - date: "2026-10-24"
        cible: libre-ai/ai-model-policy@1069ff6153cc13dd07c588e7f4ca7073520d2ffc:crates/policy-core/src/evaluator.rs
  - id: GOV-05
    nom: Registre des dépendances et tiers
    role: "Recense les dépendances et les tiers dont la flotte dépend, leur origine de distribution, les avis publiés qui les touchent et les projets évalués puis écartés."
    depend_de: []
    invariants: [I-26]
    decisions: [ADR-0021, ADR-0042, ADR-0056, D30, D54]
    depots: [libre-ai/project-governance]
    origine:
      type: inspection
