schema_version: libre-ai.brique.v1
couche: harness
# Conduire les agents (ADR-0064 D1, proposé). Deux sens du mot « harness »
# coexistent dans la doctrine, et le LEXICON relève l'ambiguïté sans la
# trancher : le cadre d'exécution des agents de la méthode, et l'outil
# agentique d'ingénierie. Cette couche décrit le premier ; seuls des dépôts de
# la flotte y sont cités en `depots` et en `preuve`.
briques:
  - id: HAR-01
    nom: Contrat de brique
    role: "Déclare pour toute brique exécutable ses entrées, ses sorties, ses effets et la preuve attendue, sous une forme qu'un gate peut lire."
    depend_de: [GOV-07]
    invariants: [I-03]
    decisions: [ADR-0034]
    # Aucun dépôt porteur déclaré : le schéma de la carte déclare le rôle, les
    # dépendances et les preuves, pas les effets.
    depots: []
    origine:
      type: inspection
      source: vision externe en briques inspectée le 2026-11-09 (analyse hors dépôt) ; forme reprise, contenu réécrit depuis la doctrine Libre AI
    autonomie: modify
    preuve: []
  - id: HAR-02
    nom: Session confinée
    role: "Fait de chaque session d'agent un objet qui porte son identité, sa zone de confinement et son journal, et qui refuse de démarrer sans eux."
    depend_de: [EXE-01, IDN-02, IDN-04]
    invariants: [I-18, I-38]
    decisions: [ADR-0018, ADR-0042]
    depots: [libre-ai/ai-work-supervision, libre-ai/execution-sandbox]
    origine:
      type: inspection
      source: vision externe en briques inspectée le 2026-11-09 (analyse hors dépôt) ; forme reprise, contenu réécrit depuis la doctrine Libre AI
    autonomie: modify
    preuve:
      - date: "2026-10-24"
        cible: libre-ai/ai-work-supervision@7a0afef5d702c3ad37647bf7949a3ea8385277e7:crates/work-supervision-pty/src/session.rs
      - date: "2026-10-24"
        cible: libre-ai/execution-sandbox@f45bb3e1a1152c0e2b2f6e4944584a5c0298c8c0:src/host/run.rs
  - id: HAR-03
    nom: Registre d'outils signé
    role: "Tient la liste fermée des outils qu'un agent peut appeler, chacun avec son empreinte SHA-256 et sa classe de données maximale, et refuse tout outil qui n'y figure pas."
    depend_de: [GOV-05]
    invariants: [I-32, I-38]
    decisions: [ADR-0045, ADR-0046, ADR-0056, D67]
    # Le registre lui-même n'est pas écrit. Le premier dépôt porte le verdict
    # rendu sur un outil que le plan autorisé ne nomme pas ; le second porte le
    # contrat de plan, où vit la liste des outils d'une exécution.
    depots: [libre-ai/execution-continuity-evaluator, libre-ai/schemas-and-contracts]
    origine:
      type: inspection
      source: vision externe en briques inspectée le 2026-11-09 (analyse hors dépôt) ; forme reprise, contenu réécrit depuis la doctrine Libre AI
    autonomie: discover
    preuve:
      - date: "2026-10-26"
        cible: libre-ai/execution-continuity-evaluator@02ff85617166d48b92d68fe8ed707896a03f4a81:src/tool_observation.rs
  - id: HAR-04
    nom: Garde-fous exécutables, juge en second
    role: "Fait juger chaque appel d'outil par un garde déterministe avant son exécution, et n'admet un juge par modèle qu'en second, pour ce que le garde ne lit pas, avec son taux de faux positifs mesuré."
    depend_de: [HAR-03]
    invariants: [I-17, I-32]
    decisions: [ADR-0045, D66]
    depots: [libre-ai/pi-harness-challenger]
    origine:
      type: inspection
      source: vision externe en briques inspectée le 2026-11-09 (analyse hors dépôt) ; forme reprise, contenu réécrit depuis la doctrine Libre AI
    autonomie: discover
    preuve:
      - date: "2026-10-13"
        cible: libre-ai/pi-harness-challenger@e0a0bde13553a64ae5d0b637f4243be29ef9c0ea:extensions/policy-gate/policy.mjs
      - date: "2026-10-13"
        cible: libre-ai/pi-harness-challenger@e0a0bde13553a64ae5d0b637f4243be29ef9c0ea:test/policy-gate.test.mjs
  - id: HAR-05
    nom: Surfaces de pilotage
    role: "Donne au propriétaire les surfaces où il voit les missions et les sessions d'agents et où il décide, sans pont du navigateur vers un terminal."
    depend_de: [HAR-02, HAR-07]
    invariants: [I-24, I-37]
    decisions: [ADR-0042]
    depots: [libre-ai/ai-work-supervision]
    origine:
