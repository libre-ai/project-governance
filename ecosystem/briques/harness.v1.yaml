  - id: HAR-06
    nom: Dialogue entre agents
    role: "Fait circuler tout message d'agent à agent comme une métadonnée typée, jamais comme un texte libre placé dans le contexte d'un modèle qui détient un outil à effet."
    depend_de: [HAR-02, IDN-04]
    invariants: [I-18, I-32]
    decisions: [ADR-0045, D66]
    depots: [libre-ai/ai-work-supervision]
    origine:
