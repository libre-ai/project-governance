  - id: HAR-09
    nom: Moteur natif commun
    role: "Exécute en Rust, sans effet ni dépendance à un framework d'agent, le graphe d'exécution autorisé qui doit servir à la fois la fabrique et le harnais."
    depend_de: [HAR-10]
    invariants: [I-06, I-08]
    # ADR-0058 (en vigueur) admet LangGraph JS comme runtime interne d'un
    # worker TypeScript ; ADR-0063 (proposé) le renverserait et étendrait le
    # cœur natif à la fabrique et au harnais.
    decisions: [ADR-0034, ADR-0037, ADR-0058, ADR-0063, D40, D43]
    depots: [libre-ai/execution-continuity-evaluator]
    origine:
      type: inspection
      source: vision externe en briques inspectée le 2026-11-09 (analyse hors dépôt) ; forme reprise, contenu réécrit depuis la doctrine Libre AI
