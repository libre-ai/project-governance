  - id: HAR-08
    nom: Contexte versionné
    role: "Versionne le contexte donné aux agents, fichiers d'instructions de dépôt et skills gouvernées, et le rend citable par son empreinte dans une preuve de mission."
    depend_de: []
    invariants: [I-38]
    decisions: [ADR-0050, D73]
    depots: [libre-ai/project-governance]
    origine:
