  - id: HAR-12
    nom: Niveaux d'autonomie par produit
    role: "Fixe par produit et par classe de données ce qu'un agent peut faire seul, de la proposition au déploiement sous budget d'erreur, et l'écrit dans la charte du produit."
    depend_de: [GOV-01]
    invariants: [I-13, I-17]
