  - id: HAR-07
    nom: File d'arrêts
    role: "Range chaque arrêt déclaré d'un agent dans une file que le propriétaire lit et tranche, avec la situation qui l'a provoqué et l'intervalle mesuré entre son ouverture et sa réponse."
    depend_de: [GOV-01, HAR-02]
    invariants: [I-17, I-24]
    decisions: [ADR-0022, ADR-0034, ADR-0051, D74]
    depots: [libre-ai/ai-work-supervision, libre-ai/schemas-and-contracts]
    origine:
      type: inspection
      source: vision externe en briques inspectée le 2026-11-09 (analyse hors dépôt) ; forme reprise, contenu réécrit depuis la doctrine Libre AI
    autonomie: modify
    preuve:
      - date: "2026-10-24"
        cible: libre-ai/ai-work-supervision@7a0afef5d702c3ad37647bf7949a3ea8385277e7:crates/work-supervision-domain/src/coordination.rs
